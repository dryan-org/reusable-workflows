name: Dependency CI

# Reusable CI for dependency-bump PRs. Detects npm / uv-Python / cargo, then:
#   - installs from the lockfile (gating; lifecycle scripts skipped for
#     robustness - this job verifies the dependency tree, not app behaviour)
#   - runs the project's build + test scripts if it has them (gating)
#   - runs an audit (advisory - a bump that only partially clears alerts still
#     needs to be mergeable)
#
# Call it from a repo with .github/workflows/ci.yml:
#
#   name: CI
#   on:
#     pull_request:
#     push: { branches: [main, master] }
#   jobs:
#     ci:
#       uses: dryan-org/reusable-workflows/.github/workflows/dependabot-ci.yml@v1
#       # only for repos that need them:
#       secrets:
#         ci_read_app_key: ${{ secrets.CI_READ_APP_KEY }}
#         npm_token: ${{ secrets.NPM_TOKEN }}
#         github_packages_token: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
#
# Private dryan-org git dependencies and submodules: give the repo the secret
# CI_READ_APP_KEY (private key of the read-only dryan-ci-read GitHub App) and
# pass it as ci_read_app_key. The workflow mints a read-only token and routes
# every dryan-org git URL through it. Works from any org.
#
# Per-repo setup: if the caller has .github/actions/ci-setup/action.yml, it runs
# after checkout and before submodule init. Composite actions cannot read
# secrets, so the secrets this workflow received are passed in as the JSON
# input `secrets` (read one with fromJSON(inputs.secrets).NAME). Callers in
# dryan-org can use `secrets: inherit` to hand over all of theirs.
#
# For a private/scoped npm registry: commit an .npmrc with the registry
# mapping(s) and an ${NPM_TOKEN} expansion (npm expands env vars in .npmrc
# itself - see
# https://developers.cloudflare.com/pages/how-to/npm-private-registry/), then
# pass npm_token. GitHub Packages works the same way with
# github_packages_token.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "lts/*"
    secrets:
      ci_read_app_key:
        # private key of the read-only dryan-ci-read GitHub App; lets
        # `uv sync` / `npm ci` / cargo / submodules reach private dryan-org repos
        required: false
      ssh_key:
        # DEPRECATED: use ci_read_app_key instead. Private key for an ssh-agent - lets `uv sync` / `npm ci`
        # reach private git dependencies (add the matching deploy key to that
        # repo). Only dryan-org/infrastructure still uses it; to be removed.
        required: false
      npm_token:
        # exposed as NPM_TOKEN for npm ci/install to consume via a checked-in
        # .npmrc's ${NPM_TOKEN} expansion (private/scoped registries)
        required: false
      github_packages_token:
        # exposed as GITHUB_PACKAGES_TOKEN, the same way, for a second
        # registry: GitHub Packages (npm.pkg.github.com), which takes a classic
        # token with read:packages. Separate from npm_token so a repo can use
        # both (Font Awesome Pro and a private @org package, say)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # make cargo fetch git deps with the git CLI so insteadOf rules apply
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout would persist GITHUB_TOKEN as an http.extraheader for
          # all of github.com, which overrides the App token in the URL
          # userinfo and breaks cross-repo reads. Nothing here pushes.
          persist-credentials: false

      # the key goes to this step only, never into job env where build and
      # test code could read it
      - name: App token for private dryan-org git deps
        id: app
        env:
          CI_READ_APP_KEY: ${{ secrets.ci_read_app_key }}
        if: env.CI_READ_APP_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          # dryan-ci-read's client id (not a secret)
          client-id: Iv23lippni8ePmlvBfpQ
          private-key: ${{ secrets.ci_read_app_key }}
          owner: dryan-org
          permission-contents: read

      - name: Route dryan-org git URLs through the App token
        if: steps.app.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://x-access-token:${APP_TOKEN}@github.com/dryan-org/"
          for from in git@github.com:dryan-org/ ssh://git@github.com/dryan-org/ https://github.com/dryan-org/; do
            git config --global --add "url.${base}.insteadOf" "$from"
          done

      - name: SSH key for private git deps
        env:
          SSH_KEY: ${{ secrets.ssh_key }}
        if: env.SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.ssh_key }}

      - name: Find repo setup action
        id: setup
        shell: bash
        run: |
          found=false
          for f in .github/actions/ci-setup/action.yml .github/actions/ci-setup/action.yaml; do
            [ -f "$f" ] && found=true
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Repo setup (.github/actions/ci-setup)
        if: steps.setup.outputs.found == 'true'
        uses: ./.github/actions/ci-setup
        with:
          # composite actions cannot read secrets; this is every received
          # secret as JSON, read one with fromJSON(inputs.secrets).NAME
          secrets: ${{ toJSON(secrets) }}

      - name: Init submodules (best effort - e.g. .pedantry shared configs)
        shell: bash
        run: |
          # One submodule at a time: a private or unreachable one (no token in
          # CI) must not abort the whole update and leave a good one (.pedantry)
          # cloned but never checked out.
          [ -f .gitmodules ] || exit 0
          { git config -f .gitmodules --get-regexp '^submodule\..*\.path$' || true; } \
            | while read -r _ path; do
                git submodule update --init --recursive -- "$path" \
                  || echo "::warning::submodule $path init failed; continuing without it"
              done

      - name: Guard against literal secrets in .npmrc
        # a committed .npmrc should only ever hold registry mappings and
        # ${ENV_VAR} expansions (see
        # https://developers.cloudflare.com/pages/how-to/npm-private-registry/)
        # - flag any _authToken/_auth/_password line with a literal value
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            if grep -nP '_(authToken|password|auth)\s*=\s*(?!\$\{)\S' "$f"; then
              echo "::error file=$f::Literal-looking credential committed in .npmrc - use \${ENV_VAR} expansion instead"
              bad=1
            fi
          done < <(find . -name .npmrc -not -path '*/node_modules/*' -print0)
          exit "$bad"

      - name: Detect ecosystems
        id: d
        shell: bash
        run: |
          npm=false; python=false; cargo=false
          [ -f package.json ] && npm=true
          if [ -f pyproject.toml ] || [ -f uv.lock ] || [ -f requirements.txt ]; then python=true; fi
          [ -f Cargo.toml ] && cargo=true
          {
            echo "npm=$npm"
            echo "python=$python"
            echo "cargo=$cargo"
          } >> "$GITHUB_OUTPUT"
          echo "npm=$npm python=$python cargo=$cargo"

      # ---------------- npm ----------------
      - if: steps.d.outputs.npm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: npm - install, build, test, audit
        if: steps.d.outputs.npm == 'true'
        env:
          NPM_TOKEN: ${{ secrets.npm_token }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.github_packages_token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
          script() { node -e "try{process.stdout.write((require('./package.json').scripts||{})['$1']||'')}catch(e){}"; }
          b="$(script build)"; if [ -n "$b" ]; then npm run build; else echo "no build script"; fi
          t="$(script test)"
          case "$t" in
            ""|*"no test specified"*) echo "no real test script; skipping" ;;
            *) npm test ;;
          esac
          l="$(script lint)"; if [ -n "$l" ]; then npm run lint; else echo "no lint script"; fi
          npm audit --audit-level=high || echo "::warning::npm audit reported issues (advisory)"

      # ---------------- python / uv ----------------
      - if: steps.d.outputs.python == 'true'
        uses: astral-sh/setup-uv@v5

      - name: python - sync, test, audit
        if: steps.d.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv sync --frozen --all-extras || uv sync --all-extras
          elif [ -f pyproject.toml ]; then
            uv sync --all-extras
          else
            uv venv && uv pip install -r requirements.txt
          fi
          has_tests=false
          { [ -d tests ] || [ -d test ]; } && has_tests=true
          compgen -G "test_*.py" >/dev/null 2>&1 && has_tests=true
          compgen -G "**/test_*.py" >/dev/null 2>&1 && has_tests=true
          if [ "$has_tests" = true ]; then
            set +e
            uv run --with pytest pytest -q
            rc=$?
            set -e
            # 5 = "no tests collected" - not a failure for our purposes
            { [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; } || exit "$rc"
          else
            echo "no tests found; skipping pytest"
          fi
          uvx pip-audit || echo "::warning::pip-audit reported issues (advisory)"

      # ---------------- cargo ----------------
      - if: steps.d.outputs.cargo == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: cargo - build, test, audit
        if: steps.d.outputs.cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked || cargo build
          cargo test
          cargo install cargo-audit --locked >/dev/null 2>&1 || true
          cargo audit || echo "::warning::cargo audit reported issues (advisory)"
